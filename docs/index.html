<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itemize — Legal</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #555555;
    --accent: #0a5cff;
    --card: #f6f7f9;
    --rule: #e2e2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #ececec;
      --muted: #a8a8a8;
      --accent: #6ea8ff;
      --card: #1c1d1f;
      --rule: #2c2c2c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 26rem;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.tag { color: var(--muted); margin-top: 0; margin-bottom: 2rem; }
  .links {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: var(--fg);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    font-size: 1rem;
  }
  a.card span.arrow { color: var(--accent); float: right; }
  footer {
    margin-top: 2rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>Itemize</h1>
  <p class="tag">Home inventory, kept on your device.</p>
  <div class="links">
    <a class="card" href="privacy.html">Privacy Policy <span class="arrow">&rarr;</span></a>
    <a class="card" href="terms.html">Terms of Use <span class="arrow">&rarr;</span></a>
  </div>
  <footer>
    <p>Contact: <a href="mailto:hongphong2120@gmail.com">hongphong2120@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
